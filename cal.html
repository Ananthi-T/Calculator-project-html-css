<link rel="STYLESHEET" href="cal.css">
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CALCULATOR</title>
    <style>
body {
  background:#111; 
  display:flex; 
  justify-content:center; 
  align-items:center; 
  height:600px;
}
.calculator {
  background:black; 
  padding:20px; 
  width:200px; 
  border-radius:25px;
}
.title { 
    background:white;
    padding:10px; 
    font-size: 20px;
    font-weight: bold;
    text-align:center; 
    border-radius:12px; }
.number { 
    color:white; 
    font-size:30px; 
    text-align:right; 
    padding:10px;
    margin-bottom:10px; }

.buttons {
  display:grid;
   grid-template-columns:repeat(4,1fr); 
   gap:10px;
}
button {
  height:55px; 
  border-radius:50%; 
  background:#333; 
  color:white; 
  font-size:20px;
}
button.light { 
    background:grey; 
    color:black; }
button.orange { 
    background:orange;}

</style>
</head>
<body>
 <div class="calculator">
  <div class="title">Welcome to Calculator</div>
  <div class=number>0</div>

  <div class="buttons">
    <button class="light">AC</button>
    <button class="light">^</button>
    <button class="light">%</button>
    <button class="orange">÷</button>

    <button>7</button><button>8</button><button>9</button><button class="orange">×</button>
    <button>4</button><button>5</button><button>6</button><button class="orange">−</button>
    <button>1</button><button>2</button><button>3</button><button class="orange">+</button>

    <button >0</button>
    <button>00</button>
    <button>.</button>
    <button class="orange">=</button>
  </div>
</div>
   
</body>
</html>
